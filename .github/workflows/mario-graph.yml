name: Generate Dynamic Profile SVGs

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch:    # Allows manual trigger in the Actions tab
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow
      - name: Generate Profile 3D SVGs and Animations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
        run: |
          python generate_isometric_contributions.py
          python generate_minecraft.py
          python generate_3d_analytics.py
          python generate_game_skill_3d.py
          python generate_360_rotation.py
      - name: Push SVGs and 3D Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add isometric_contributions.svg minecraft_contribution.svg analytics_3d.svg game_skill_3d.svg contributions_3d_360.gif
          git commit -m "chore: update interactive profile and 3D assets [skip ci]" || echo "No changes"
          git push
